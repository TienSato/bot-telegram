<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thiết lập Admin — Read Mail Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.1);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        h1 {
            font-size: 22px;
            color: #1a1a2e;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 18px;
            transition: border-color .2s;
        }
        input:focus {
            outline: none;
            border-color: #417af5;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #417af5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
        }
        button:hover { background: #3060d0; }
        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🤖 Read Mail Bot</h1>
        <p class="subtitle">Tạo tài khoản admin để bắt đầu quản lý bot.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" required autofocus
                   value="{{ request.POST.username }}">

            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" required>

            <label for="password2">Nhập lại mật khẩu</label>
            <input type="password" id="password2" name="password2" required>

            <button type="submit">Tạo tài khoản Admin</button>
        </form>
    </div>
</body>
</html>
