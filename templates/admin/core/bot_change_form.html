{% extends "admin/change_form.html" %}
{% load i18n %}

{% block after_field_sets %}
{{ block.super }}

{% if original %}
<fieldset class="module aligned">
    <h2>Kiểm thử kết nối</h2>
    <div class="form-row" style="padding: 10px;">
        <button type="button" id="btn-test-bot" class="button"
                style="padding: 8px 20px; font-size: 14px; cursor: pointer; background: #417690; color: white; border: none; border-radius: 4px;">
            Kiểm thử kết nối bot
        </button>
        <div id="test-result" style="margin-top: 10px; display: none; padding: 12px; border-radius: 4px;"></div>
    </div>
</fieldset>

<script>
document.getElementById('btn-test-bot').addEventListener('click', function() {
    const btn = this;
    const result = document.getElementById('test-result');

    btn.disabled = true;
    btn.textContent = 'Đang kiểm tra...';
    result.style.display = 'none';

    fetch('test-connection/')
        .then(r => r.json())
        .then(data => {
            result.style.display = 'block';
            if (data.ok) {
                result.style.background = '#d4edda';
                result.style.border = '1px solid #c3e6cb';
                result.style.color = '#155724';
                let html = '<strong>Kết nối thành công!</strong><br>';
                html += '<table style="margin-top:8px;border-collapse:collapse;">';
                html += '<tr><td style="padding:3px 10px 3px 0;font-weight:bold;">Bot ID:</td><td>' + data.bot_id + '</td></tr>';
                html += '<tr><td style="padding:3px 10px 3px 0;font-weight:bold;">Username:</td><td>@' + data.username + '</td></tr>';
                html += '<tr><td style="padding:3px 10px 3px 0;font-weight:bold;">Tên:</td><td>' + data.first_name + '</td></tr>';
                html += '<tr><td style="padding:3px 10px 3px 0;font-weight:bold;">Vào nhóm:</td><td>' + (data.can_join_groups ? 'Có' : 'Không') + '</td></tr>';
                html += '<tr><td style="padding:3px 10px 3px 0;font-weight:bold;">Đọc tin nhóm:</td><td>' + (data.can_read_all_group_messages ? 'Có' : 'Không') + '</td></tr>';
                html += '</table>';
                result.innerHTML = html;
            } else {
                result.style.background = '#f8d7da';
                result.style.border = '1px solid #f5c6cb';
                result.style.color = '#721c24';
                result.innerHTML = '<strong>Kết nối thất bại!</strong><br>' + data.error;
            }
            btn.disabled = false;
            btn.textContent = 'Kiểm thử kết nối bot';
        })
        .catch(err => {
            result.style.display = 'block';
            result.style.background = '#f8d7da';
            result.style.border = '1px solid #f5c6cb';
            result.style.color = '#721c24';
            result.innerHTML = '<strong>Lỗi:</strong> ' + err.message;
            btn.disabled = false;
            btn.textContent = 'Kiểm thử kết nối bot';
        });
});
</script>
{% endif %}
{% endblock %}
